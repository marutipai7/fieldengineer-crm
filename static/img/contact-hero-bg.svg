<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" fill="none" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="contactHeroBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021537"/>
      <stop offset="45%" stop-color="#090831"/>
      <stop offset="100%" stop-color="#010a67"/>
    </linearGradient>
    <pattern id="contactGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1466DE" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="contactGlowRight" cx="75%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#1466DE" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#084de5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#021537" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contactGlowLeft" cx="15%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#4869e1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#021537" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="contactAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1466DE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1466DE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1466DE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="720" fill="url(#contactHeroBase)"/>
  <rect width="1440" height="720" fill="url(#contactGrid)"/>
  <rect width="1440" height="720" fill="url(#contactGlowRight)"/>
  <rect width="1440" height="720" fill="url(#contactGlowLeft)"/>

  <text x="80" y="520" fill="#FFFFFF" fill-opacity="0.04" font-family="Open Sans, sans-serif" font-size="180" font-weight="800" letter-spacing="-4">CONTACT FE</text>

  <g opacity="0.55">
    <circle cx="1180" cy="180" r="3" fill="#1466DE"/>
    <circle cx="1220" cy="220" r="2.5" fill="#1591EA"/>
    <circle cx="1260" cy="160" r="2" fill="#4869e1"/>
    <circle cx="1100" cy="280" r="2.5" fill="#1466DE"/>
    <circle cx="1320" cy="300" r="3" fill="#1591EA"/>
    <circle cx="1050" cy="360" r="2" fill="#4869e1"/>
    <circle cx="1280" cy="400" r="2.5" fill="#1466DE"/>
  </g>

  <path d="M900 120 C980 90 1080 110 1140 180 C1200 250 1180 360 1100 420 C1020 480 900 500 820 460 C740 420 700 330 720 250 C740 170 820 150 900 120 Z" fill="none" stroke="#1466DE" stroke-opacity="0.18" stroke-width="1.5"/>
  <path d="M960 200 C1010 175 1060 190 1090 235 C1120 280 1105 340 1060 370 C1015 400 955 405 915 375 C875 345 865 285 890 240 C915 195 960 200 960 200 Z" fill="#1466DE" fill-opacity="0.08"/>

  <line x1="0" y1="680" x2="1440" y2="680" stroke="url(#contactAccentLine)" stroke-width="1"/>

{% extends 'layout.html' %}
{% block content %}
        <div class="headerMapArea">
            <!-- Map Area -->
            <div class="flex-1 absolute  w-full top-0 z-0 bg-ice-gray">
                <!-- Map -->
                <div class="bg-white shadow-sm border-b p-4 pt-0">
                    <div class="flex items-center justify-between gap-4 absolute top-28 z-[999] w-full px-20">
                        <!-- Location Dropdown -->
                        <div class="relative" id="locationSelect">
                            <div id="locationDropdownBtn"
                                class="flex items-center gap-2 bg-white h-10 w-45 justify-between p-2 rounded-lg primary-box-shadow cursor-pointer">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="map-pin" class="w-5 h-5 text-gray"></i>
                                    <span id="selectedLocation" class="font-medium text-gray text-nowrap">New York,
                                        NY</span>
                                </div>

                                <i class="fas fa-caret-down"></i>
                            </div>
                            <div id="locationDropdownMenu"
                                class="absolute left-0  w-45 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg hidden z-50">
                                <div class="py-1">
                                    <div data-value="New York, NY"
                                        class="dropdown-item px-4 py-2 cursor-pointer hover:bg-powder-aqua">New York, NY
                                    </div>
                                    <div data-value="Los Angeles, CA"
                                        class="dropdown-item px-4 py-2 cursor-pointer hover:bg-powder-aqua">Los Angeles,
                                        CA
                                    </div>
                                    <div data-value="Chicago, IL"
                                        class="dropdown-item px-4 py-2 cursor-pointer hover:bg-powder-aqua">Chicago, IL
                                    </div>
                                    <div data-value="Miami, FL"
                                        class="dropdown-item px-4 py-2 cursor-pointer hover:bg-powder-aqua">Miami, FL
                                    </div>
                                    <div data-value="Houston, TX"
                                        class="dropdown-item px-4 py-2 cursor-pointer hover:bg-powder-aqua">Houston, TX
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="resultsCount" class="hidden text-sm text-gray-600">
                            5 locations found
                        </div>
                        <div class="flex items-center gap-4">
                            <button
                                class="w-10 h-10 rounded-lg bg-white flex items-center justify-center cursor-pointer">
                                <img src="/static/img/notification-icon.svg" alt="notification">
                            </button>
                            <button
                                class="w-10 h-10 rounded-lg bg-white flex items-center justify-center cursor-pointer">
                                <img src="/static/img/shopping-cart.svg" alt="Cart">
                            </button>
                        </div>
                    </div>
                </div>

                <div id="map"
                    class="w-full rounded-tl-none rounded-tr-none [border-bottom-right-radius:100px] [border-bottom-left-radius:100px] h-[550px]">
                </div>

                <!-- Loading overlay -->
                <div id="loadingOverlay" class="absolute inset-0 bg-gray-100 flex items-center justify-center">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-2"></div>
                        <p class="text-gray-600">Loading map...</p>
                    </div>
                </div>

                <!-- Category Filter Buttons -->
                {% comment %} <div class="absolute bottom-12 left-1/2 transform -translate-x-1/2 z-[1000]">
                    <div class="flex gap-2 p-2">

                        <a href="?type=pharmacy"
                            class="category-btn primary-btn rounded-lg border-0 font-bold
                            {% if category == 'pharmacy' %}
                                bg-[#238b6d] text-white
                            {% else %}
                                bg-white hover:bg-[#238b6d] hover:text-white
                            {% endif %}">
                            Pharmacy
                        </a>

                        <a href="?type=hospital"
                            class="category-btn primary-btn rounded-lg border-0 font-bold
                            {% if category == 'hospital' %}
                                bg-[#238b6d] text-white
                            {% else %}
                                bg-white hover:bg-[#238b6d] hover:text-white
                            {% endif %}">
                            Hospital
                        </a>

                        <a href="?type=doctor"
                            class="category-btn primary-btn rounded-lg border-0 font-bold
                            {% if category == 'doctor' %}
                                bg-[#238b6d] text-white
                            {% else %}
                                bg-white hover:bg-[#238b6d] hover:text-white
                            {% endif %}">
                            Doctor
                        </a>

                        <a href="?type=lab"
                            class="category-btn primary-btn rounded-lg border-0 font-bold
                            {% if category == 'lab' %}
                                bg-[#238b6d] text-white
                            {% else %}
                                bg-white hover:bg-[#238b6d] hover:text-white
                            {% endif %}">
                            Lab
                        </a>

                    </div>
                </div> {% endcomment %}
                <div class="-mt-6 flex items-center justify-center">
                    <div class="w-full max-w-xl rounded-lg primary-box-shadow z-[9999]">
                        <div class="relative bg-white rounded-lg">
                            <!-- <i data-lucide="search"
                            class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"></i> -->
                            <input id="searchInput" type="text"
                                placeholder="I want to search for Medicine, Brands, Doctor, Pharmacy, etc."
                                class="w-full pl-4 pr-18 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none " />
                            <i class="fa-solid fa-microphone absolute right-12 top-1/2 -translate-y-1/2 w-4 h-4"></i>
                            <i class="fa-solid fa-camera absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="h-[500px]"></div>
        </div>
{% endblock %}
{% block extra_js %}
    <script src="/static/script/doctor/form.js"></script>
    <script src="/static/script/doctor/validation.js"></script>
    <script src="/static/script/doctor/searching.js"></script>
{% endblock %}

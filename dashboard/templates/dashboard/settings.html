{% extends "dashboard/layout.html" %}

{% block title %}Settings{% endblock %}

{% block content %}

<!-- Empty State for Bookings with Settings Page Redirect -->
<div class="flex flex-col items-center justify-center min-h-[60vh] px-4">
    <div class="text-center max-w-md">
        <!-- Icon -->
        <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="material-symbols-outlined text-4xl text-blue-400">
                event_busy
            </span>
        </div>
        
        <!-- Title -->
        <h3 class="text-2xl font-semibold text-gray-800 mb-2">
            No Bookings Found
        </h3>
        
        <!-- Description -->
        <p class="text-gray-500 text-base leading-relaxed mb-6">
            You haven't made any bookings yet. 
            Start exploring our services and book your first appointment today!
        </p>
        
        <!-- Action Button - Redirects to Settings -->
        <a href="/dashboard/" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition duration-200">
            <span class="material-symbols-outlined text-sm">settings</span>
            Go to Settings
        </a>
    </div>
</div>

{% endblock %}
